<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釣果メモアプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>釣果メモアプリ</h1>

    <div class="form-area">
        <label>場所</label>
        <input type="text" id="fishingPlace">

        <button id="locationButton">
            現在地取得
        </button>

        <p id="locationText">
            緯度経度: 未取得
        </p>

        <p id="weatherText">
            天気: 未取得
        </p>

        <!--
        <p id="windText">
            風速: 未取得
        </p>
        -->
        
        <label>魚種</label>
        <input type="text" id="fishName">

        <label>サイズ(cm)</label>
        <input type="number" id="fishSize">

        <label>釣り方</label>
        <input type="text" id="fishingMethod">

        <label>メモ</label>
        <textarea id="memo"></textarea>

        <button id="saveButton">
            保存
        </button>

    </div>

    <h2>釣果一覧</h2>

<div id="resultArea">

</div>

    <script src="app.js"></script>

</body>
</html>
